<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SathyaSethu | Prompt Workspace</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Momo+Trust+Display&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/prompt.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <!-- Ambient background glow matching warm gold/amber theme -->
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Left Navigation & Sidebar -->
    <aside class="left-sidebar">
      <div class="brand-section">
        <!-- Icon is an img with NO border around it -->
        <div class="brand-icon-wrapper" id="brandIconWrapper">
          <img src="" alt="" class="brand-icon-img" id="brandIconImg" style="display:none;" />
        </div>
        
        <!-- Dashboard Button -->
        <a href="/dashboard" class="dashboard-btn" id="dashboardBtn">
          <span class="btn-arrow">◀</span>
          <span>Dashboard</span>
        </a>

        <!-- Empty text slot below icon and dashboard -->
        <div class="brand-text-wrapper" id="brandTextWrapper">
          <span class="brand-text" id="brandText"></span>
        </div>
      </div>

      <!-- Chat History Panel (pure text clickable items, no borders) -->
      <nav class="chat-history-panel" aria-label="Chat History">
        <h2 class="sidebar-title">Chat History</h2>
        <ul class="chat-history-list" id="chatHistoryList">
          <!-- Populated dynamically when chats occur -->
        </ul>
      </nav>
    </aside>

    <!-- Main Workspace Area -->
    <main class="main-area">
      <!-- Chat Conversation Log -->
      <section class="chat-container" id="chatContainer">
        <!-- Messages will be appended here dynamically -->
      </section>

      <!-- Interactive AI Selection Area (Hidden by default) -->
      <div class="ai-selection-area" id="aiSelectionArea" style="display: none; margin: 0 20px 20px 20px; z-index: 10;">
        <div id="paletteDisplay" class="selection-grid"></div>
        <div id="fontDisplay" class="selection-grid"></div>
        <button type="button" id="confirmSelectionBtn" class="dashboard-btn" style="margin-top: 14px; display: none;">Confirm Selection</button>
      </div>

      <!-- Bottom Prompt & File Upload Area (stuck to bottom, no border) -->
      <form class="prompt-box-form" id="promptForm">
        <!-- Configuration Panel (Hidden by default) -->
        <div class="config-panel" id="configPanel" style="display: none;">
          <div class="config-grid">
            <div class="config-group">
              <label for="outFormats">Output Formats (Ctrl+click)</label>
              <select id="outFormats" multiple size="4">
                <option value="video">Video Package</option>
                <option value="linkedin">LinkedIn Post</option>
                <option value="twitter">Twitter/X Post</option>
                <option value="advisory">Advisory</option>
                <option value="infographic">Infographic</option>
                <option value="exec_summary">Executive Summary</option>
                <option value="presentation">Presentation</option>
                <option value="website">Website</option>
              </select>
            </div>
            <div class="config-group">
              <label for="outAudience">Target Audience</label>
              <input type="text" id="outAudience" placeholder="e.g. Executives, General Public" />
              
              <label for="outTone">Tone</label>
              <select id="outTone">
                <option value="professional">Professional</option>
                <option value="casual">Casual</option>
                <option value="persuasive">Persuasive</option>
                <option value="informative">Informative</option>
              </select>
            </div>
            <div class="config-group">
              <label for="outLanguage">Language</label>
              <input type="text" id="outLanguage" placeholder="e.g. English" value="English" />
              
              <label for="outLevel">Level of Detail</label>
              <select id="outLevel">
                <option value="concise">Concise</option>
                <option value="standard" selected>Standard</option>
                <option value="detailed">Detailed</option>
                <option value="comprehensive">Comprehensive</option>
              </select>
            </div>
            <div class="config-group">
              <label for="outObjective">Communication Objective</label>
              <input type="text" id="outObjective" placeholder="e.g. Inform, Persuade, Alert" />
              
              <label for="outStyle">Content Style</label>
              <input type="text" id="outStyle" placeholder="e.g. Corporate, Storytelling" />
            </div>
          </div>
        </div>

        <div class="input-container">
          <div class="attached-files-list" id="attachedFilesList"></div>
          <textarea
            id="promptInput"
            class="prompt-textarea"
            placeholder="What should we do today"
            rows="2"
          ></textarea>
        </div>

        <div class="prompt-actions">
          <!-- Configuration Toggle Button -->
          <button type="button" class="config-toggle-btn" id="configToggleBtn" title="Generation Settings">
            <img src="/assets/settings.svg" alt="Settings" class="action-icon-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%23a1a1a1\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><circle cx=\'12\' cy=\'12\' r=\'3\'></circle><path d=\'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z\'></path></svg>'"/>
          </button>

          <!-- File Upload Button with img icon, accepts any file format -->
          <label class="file-upload-btn" title="Upload files" for="fileInput">
            <img src="/assets/file-plus.svg" alt="Attach files" class="action-icon-img" />
            <input
              type="file"
              id="fileInput"
              multiple
              aria-label="Upload files (any format)"
            />
          </label>

          <!-- Submit Button with img icon -->
          <button type="submit" class="submit-prompt-btn" id="submitBtn" aria-label="Send Prompt">
            <img src="/assets/send.svg" alt="Send" class="action-icon-img" />
          </button>

          <!-- Stop Button (Visible during generation) -->
          <button type="button" class="stop-prompt-btn" id="stopBtn" aria-label="Stop Generation" style="display: none;" title="Stop AI Generation">
            <span class="stop-icon">■</span>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="/js/prompt.js"></script>
</body>
</html>
