<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SathyaSethu | Prompt Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Momo+Trust+Display&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/prompt.css">
</head>
<body>
  <!-- Ambient background glow matching login -->
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Left Navigation & Sidebar -->
    <aside class="left-sidebar">
      <div class="brand-section">
        <!-- Icon is an img with NO border around it -->
        <div class="brand-icon-wrapper" id="brandIconWrapper">
          <img src="" alt="" class="brand-icon-img" id="brandIconImg" style="display:none;" />
        </div>
        
        <!-- Dashboard Button -->
        <a href="/dashboard" class="dashboard-btn" id="dashboardBtn">
          <span class="btn-arrow">◀</span>
          <span>Dashboard</span>
        </a>

        <!-- Empty text slot below icon and dashboard -->
        <div class="brand-text-wrapper" id="brandTextWrapper">
          <span class="brand-text" id="brandText"></span>
        </div>
      </div>

      <!-- Chat History Panel (pure text clickable items, no placeholder list) -->
      <nav class="chat-history-panel" aria-label="Chat History">
        <h2 class="sidebar-title">Chat History</h2>
        <ul class="chat-history-list" id="chatHistoryList">
          <!-- Populated dynamically when chats occur -->
        </ul>
      </nav>
    </aside>

    <!-- Main Workspace Area -->
    <main class="main-area">
      <!-- Chat Conversation Log -->
      <section class="chat-container" id="chatContainer">
        <!-- User Query Bubble (hidden until first query is entered) -->
        <div class="user-message-row" id="userMessageRow" style="display: none;">
          <div class="user-bubble" id="userMessageText"></div>
        </div>

        <!-- AI Engine Response Card (hidden until a query/result is loaded) -->
        <div class="ai-response-card" id="aiResponseCard" style="display: none;">
          <div class="ai-header">
            <p class="ai-text" id="aiStatusText"></p>
            <span class="engine-badge">SS ENGINE</span>
          </div>

          <!-- Embedded Iframe for Rendered Result -->
          <div class="iframe-wrapper">
            <iframe
              id="contentIframe"
              class="preview-iframe"
              title="Rendered Output Preview"
              srcdoc=""
            ></iframe>
          </div>
        </div>
      </section>

      <!-- Bottom Prompt & File Upload Area (taller prompt window) -->
      <form class="prompt-box-form" id="promptForm">
        <div class="input-container">
          <div class="attached-files-list" id="attachedFilesList"></div>
          <textarea
            id="promptInput"
            class="prompt-textarea"
            placeholder="What should we do today"
            rows="2"
          ></textarea>
        </div>

        <div class="prompt-actions">
          <!-- File Upload Button with img icon, accepts any file format -->
          <label class="file-upload-btn" title="Upload files" for="fileInput">
            <img src="/assets/file-plus.svg" alt="Attach files" class="action-icon-img" />
            <input
              type="file"
              id="fileInput"
              multiple
              aria-label="Upload files (any format)"
            />
          </label>

          <!-- Submit Button with img icon -->
          <button type="submit" class="submit-prompt-btn" id="submitBtn" aria-label="Send Prompt">
            <img src="/assets/send.svg" alt="Send" class="action-icon-img" />
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="/js/prompt.js"></script>
</body>
</html>
