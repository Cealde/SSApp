<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }
        .tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 2px solid #e2e8f0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .tab.active {
            color: #2563eb;
            border-bottom: 2px solid #2563eb;
            margin-bottom: -2px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: -6px;
        }
        input {
            padding: 11px 13px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }
        #message {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tabs">
            <div id="tab-login" class="tab active" onclick="switchMode('login')">Log In</div>
            <div id="tab-signup" class="tab" onclick="switchMode('signup')">Sign Up</div>
        </div>

        <form id="auth-form" onsubmit="handleSubmit(event)" class="form-group">
            <!-- Signup-only fields -->
            <div id="signup-fields" style="display: none; flex-direction: column; gap: 12px;">
                <div>
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" placeholder="John" style="width: 100%;">
                </div>
                <div>
                    <label for="organization">Organization Name</label>
                    <input type="text" id="organization" placeholder="e.g. Acme Corp" style="width: 100%;">
                </div>
                <div>
                    <label for="organization_password">Organization Password</label>
                    <input type="password" id="organization_password" placeholder="Organization join secret" style="width: 100%;">
                </div>
            </div>

            <!-- Common fields -->
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@company.com" required style="width: 100%;">
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required style="width: 100%;">
            </div>

            <button type="submit" id="submit-btn">Log In</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        let currentMode = 'login';

        function switchMode(mode) {
            currentMode = mode;
            const isSignUp = mode === 'signup';

            document.getElementById('tab-login').classList.toggle('active', !isSignUp);
            document.getElementById('tab-signup').classList.toggle('active', isSignUp);

            const signupFields = document.getElementById('signup-fields');
            signupFields.style.display = isSignUp ? 'flex' : 'none';

            document.getElementById('first_name').required = isSignUp;
            document.getElementById('organization').required = isSignUp;
            document.getElementById('organization_password').required = isSignUp;

            document.getElementById('submit-btn').innerText = isSignUp ? 'Create Account' : 'Log In';
            document.getElementById('message').innerText = '';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submit-btn');

            messageDiv.style.color = '#2563eb';
            messageDiv.innerText = 'Processing...';
            submitBtn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                if (currentMode === 'login') {
                    // --- LOGIN FLOW ---
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        messageDiv.style.color = '#dc2626';
                        messageDiv.innerText = 'Error: ' + (data.detail || JSON.stringify(data));
                        submitBtn.disabled = false;
                        return;
                    }

                    // 1. Save access token
                    if (data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                    }

                    // 2. Save organization name and icon in BOTH sessionStorage and localStorage
                    if (data.user && data.user.organization) {
                        const org = data.user.organization;
                        const orgData = JSON.stringify(org);

                        localStorage.setItem('organization', orgData);
                        sessionStorage.setItem('organization', orgData);

                        localStorage.setItem('org_name', org.name || '');
                        sessionStorage.setItem('org_name', org.name || '');

                        localStorage.setItem('org_icon', org.icon || '');
                        sessionStorage.setItem('org_icon', org.icon || '');
                    }

                    if (data.user) {
                        localStorage.setItem('user_email', data.user.email || email);
                        localStorage.setItem('first_name', data.user.first_name || '');
                    }

                    messageDiv.style.color = '#16a34a';
                    messageDiv.innerText = 'Login successful! Redirecting to index...';

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 600);

                } else {
                    // --- SIGNUP FLOW ---
                    const first_name = document.getElementById('first_name').value.trim();
                    const organization = document.getElementById('organization').value.trim();
                    const organization_password = document.getElementById('organization_password').value;

                    const res = await fetch('/api/auth/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            first_name,
                            email,
                            password,
                            organization,
                            organization_password
                        })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        messageDiv.style.color = '#dc2626';
                        messageDiv.innerText = 'Error: ' + (data.detail || JSON.stringify(data));
                        submitBtn.disabled = false;
                        return;
                    }

                    messageDiv.style.color = '#16a34a';
                    messageDiv.innerHTML = `
                        <strong>Registration successful!</strong><br>
                        Please check your email to confirm your account, then log in.
                    `;

                    setTimeout(() => {
                        switchMode('login');
                        document.getElementById('email').value = email;
                    }, 2500);
                }
            } catch (err) {
                messageDiv.style.color = '#dc2626';
                messageDiv.innerText = 'Network error: ' + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
