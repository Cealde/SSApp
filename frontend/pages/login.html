<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SathyaSethu | Authentication</title>
    <meta
      name="description"
      content="Secure sign in and sign up for SathyaSethu."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Momo+Trust+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body class="auth-page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="ambient ambient-three" aria-hidden="true"></div>

    <main class="auth-shell" aria-labelledby="auth-title">
      <h1 id="auth-title" class="auth-top-brand">SathyaSethu</h1>

      <section class="login-panel" aria-label="SathyaSethu authentication panel">

        <div class="welcome-copy" id="welcomeCopy">
          <h2 id="authHeading">Login</h2>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="loginEmail">Email</label>
            <input
              id="loginEmail"
              name="loginEmail"
              type="email"
              autocomplete="email"
              placeholder="Email"
              aria-describedby="loginEmailError"
              required
            />
            <small id="loginEmailError" class="field-error" aria-live="polite"></small>
          </div>

          <div class="field-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrap">
              <input
                id="loginPassword"
                name="loginPassword"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                aria-describedby="loginPasswordError"
                required
              />
              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
                data-password-toggle="loginPassword"
              >
                Show
              </button>
            </div>
            <small id="loginPasswordError" class="field-error" aria-live="polite"></small>
          </div>

          <div class="meta-row">
            <label class="remember-me" for="rememberMe">
              <input id="rememberMe" name="rememberMe" type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#" class="text-link">Forgot password?</a>
          </div>

          <button type="submit" class="primary-button" id="signInButton">
            <span class="button-label">Log In</span>
          </button>

          <p id="loginStatus" class="form-status" role="alert" aria-live="polite"></p>
        </form>

        <form id="signupForm" class="auth-form hidden" novalidate>
          <div class="field-group">
            <label for="signupFirstName">First Name</label>
            <input
              id="signupFirstName"
              name="signupFirstName"
              type="text"
              autocomplete="given-name"
              placeholder="First Name"
              aria-describedby="signupFirstNameError"
              required
            />
            <small id="signupFirstNameError" class="field-error" aria-live="polite"></small>
          </div>

          <div class="field-group">
            <label for="signupEmail">Email</label>
            <input
              id="signupEmail"
              name="signupEmail"
              type="email"
              autocomplete="email"
              placeholder="Email"
              aria-describedby="signupEmailError"
              required
            />
            <small id="signupEmailError" class="field-error" aria-live="polite"></small>
          </div>

          <div class="field-group">
            <label for="signupPassword">Password</label>
            <div class="password-wrap">
              <input
                id="signupPassword"
                name="signupPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Create a password"
                aria-describedby="signupPasswordError"
                required
              />
              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
                data-password-toggle="signupPassword"
              >
                Show
              </button>
            </div>
            <small id="signupPasswordError" class="field-error" aria-live="polite"></small>
          </div>

          <div class="field-group">
            <label for="signupOrganization">Organization Name</label>
            <input
              id="signupOrganization"
              name="signupOrganization"
              type="text"
              autocomplete="organization"
              placeholder="Organization Name"
              aria-describedby="signupOrganizationError"
              required
            />
            <small id="signupOrganizationError" class="field-error" aria-live="polite"></small>
          </div>

          <div class="field-group">
            <label for="signupOrganizationPassword">Organization Password</label>
            <div class="password-wrap">
              <input
                id="signupOrganizationPassword"
                name="signupOrganizationPassword"
                type="password"
                autocomplete="off"
                placeholder="Organization Password"
                aria-describedby="signupOrganizationPasswordError"
                required
              />
              <button
                type="button"
                class="password-toggle"
                aria-label="Show organization password"
                data-password-toggle="signupOrganizationPassword"
              >
                Show
              </button>
            </div>
            <small id="signupOrganizationPasswordError" class="field-error" aria-live="polite"></small>
          </div>

          <button type="submit" class="primary-button" id="signUpButton">
            <span class="button-label">Sign Up</span>
          </button>

          <p id="signupStatus" class="form-status" role="alert" aria-live="polite"></p>
        </form>

        <div id="confirmationState" class="auth-confirmation hidden" aria-live="polite">
          <div class="mail-icon" aria-hidden="true">✉</div>
          <h3>Check your email</h3>
          <p>
            We've sent a confirmation link to
            <strong id="confirmationEmail">your@email.com</strong>.
          </p>
          <p>
            Please click the link in the email to confirm your account and continue.
          </p>
          <div class="confirmation-actions">
            <button type="button" class="primary-button confirmation-button" id="goToLoginButton">
              <span class="button-label">Go to Login</span>
            </button>
          </div>
          <div class="resend-row">
            <span>Didn't receive it?</span>
            <button type="button" class="text-button" id="resendEmailButton">Resend email</button>
          </div>
          <p id="confirmationStatus" class="form-status" aria-live="polite"></p>
        </div>

        <div class="auth-footer">
          <span id="footerPrompt">Don't have an account?</span>
          <button type="button" class="toggle-link" id="toggleModeButton">Sign Up</button>
        </div>
      </section>
    </main>

    <script src="/js/login.js"></script>
  </body>
</html>
