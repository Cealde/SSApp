<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSApp</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <form id="user-form">
        <input type="text" id="text-input" placeholder="Enter text">

        <input
            type="file"
            id="file-input"
            name="files"
            accept="application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,audio/*,video/*"
            multiple>

        <button type="submit">Send</button>
    </form>

    <div id="output"></div>

    <div id="mermaid-section">
        <h2>Mermaid Diagram</h2>
        <textarea id="mermaid-input" rows="8" placeholder="..."></textarea>
        <button id="render-mermaid" type="button">Render Diagram</button>
        <div id="mermaid-output" class="mini-box">...</div>
    </div>

    <script src="../js/mermaid.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
