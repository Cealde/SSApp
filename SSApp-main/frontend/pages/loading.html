<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SathyaSethu | Loading</title>
    <meta
      name="description"
      content="Preparing your SathyaSethu workspace."
    />
    <link rel="stylesheet" href="/css/loading.css" />
  </head>
  <body class="loading-page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="loading-shell" aria-live="polite" aria-busy="true">
      <div class="loading-orb" aria-hidden="true">
        <div class="orb-core">
          <span>S</span>
        </div>
      </div>

      <div class="loading-copy">
        <p class="eyebrow">SathyaSethu</p>
        <h1>Preparing your workspace...</h1>
        <div class="status-row">
          <span class="status-dot"></span>
          <span>Syncing sessions and files</span>
        </div>
      </div>
    </main>

    <script src="/js/loading.js"></script>
  </body>
</html>
